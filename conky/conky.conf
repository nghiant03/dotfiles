conky.config ={
  -- CONKY SETTINGS
	out_to_x = false,
	out_to_wayland =true,

  background = true,
  update_interval = 1,
  total_run_times = 0,
  
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  
  override_utf8_locale = true,
  
  double_buffer = true,
  no_buffers = true,
  
  text_buffer_size = 32768,
  
  -- CONKY: WINDOW SPECIFICATIONS
  own_window = true,
  own_window_argb_value = 75,
  own_window_argb_visual = true,
  own_window_class = 'conky-semi',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = true,
  -- own_window_transparent = false,
  own_window_type = 'dock',

  border_inner_margin = 6,
  border_width = 5, 

  minimum_height = 1020,

  minimum_width = 200,
  maximum_width = 200,

  alignment = 'top_right',
  gap_x = 10,
  gap_y = 15,

  -- GRAPHICS SETTINGS
  draw_shades = false,
  draw_outline = true,
  draw_borders = false,
  draw_graph_borders = true,
  -- draw_graph_borders = false,
  double_buffer = true,

  -- TEXT SETTINGS
  use_xft = true,
  font = 'Roboto:size=8',

  uppercase = false,

  -- Pad percentages to this many decimals (0 = no padding)
  pad_percents = 2,

  -- COLOUR SETTINGS
  default_color = '777777',
  default_shade_color = '222222',
  default_outline_color = '111111',
  -- default_outline_color = '010101',
  color1 = 'c71010',
  color2 = '188f18',
  color3 = 'EEEEEE',
  color4 = '444444',
  color5 = '555555',
  color6 = '666666',
  color7 = '3b71a1',
};


conky.text = [[
${font :size=10}SYSTEM ${hr 1}${font}
${voffset -10}
Hostname: ${alignr}$nodename 
OS: ${alignr}${exec lsb_release -d| awk '{$1=""; print $0}'}
Kernel: ${alignr}$kernel
Uptime: ${alignr}$uptime_short
${voffset -8}
${font :size=10}CPUs ${hr 1}${font}
${voffset -10}
CPU: ${alignr}${exec lscpu | grep 'Model name' | awk -F: '{print $2}' | awk '{print $NF}'}
${font :size=9}01 - 04:${font} ${goto 200}${color2}${cpu cpu1}% ${goto 240}${cpu cpu2 }% ${goto 280}${cpu cpu3 }% ${goto 320}${cpu cpu4 }%${color}
${font :size=9}05 - 08:${font} ${goto 200}${color2}${cpu cpu5}% ${goto 240}${cpu cpu6 }% ${goto 280}${cpu cpu7 }% ${goto 320}${cpu cpu8 }%${color}
${font :size=9}09 - 12:${font} ${goto 200}${color2}${cpu cpu9}% ${goto 240}${cpu cpu10}% ${goto 280}${cpu cpu11}% ${goto 320}${cpu cpu12}%${color}
${font :size=9}13 - 16:${font} ${goto 200}${color2}${cpu cpu13}% ${goto 240}${cpu cpu14}% ${goto 280}${cpu cpu15}% ${goto 320}${cpu cpu16}%${color}
${voffset -8}
CPU Temp:${font} ${font :size=9}${alignr}${color1}${hwmon 1 temp 1}°C${color}
${voffset -8}
${font :size=10}${color}Network ${color}${hr 1}${color}${font}
${voffset -10}
IP Address: ${alignr}${addr wlan0}
${if_match "${addr wlan0}"!="No Address"}
${font :size=09}Download ${alignr}${downspeedf wlan0}k/s (${totaldown wlan0})${font}
${color3}${downspeedgraph wlan0 25,200 ADFF2F 32CD32 -t}${color}
${font :size=9}Upload ${alignr}${upspeedf wlan0}k/s (${totalup wlan0})${font}
${color3}${upspeedgraph wlan0 25,200 FF0000 8B0000 -t}${color}
${endif}
${font :size=10}Storage ${hr 1}${font}
${voffset -10}
${font :size=9}Used: ${fs_used /}${alignr}Free: ${fs_free /}${font}
${voffset -8}
${fs_bar /}
${voffset -8}
${font :size=9}Disk I/O: ${alignr}$diskio${font}
${voffset 2}${font :size=9}Read: ${goto 180}${color3}${diskiograph_read 15, 150 ADFF2F 32CD32 750}${color}
${voffset 2}${font :size=9}Write: ${goto 180}${color3}${diskiograph_write 15, 150 FF0000 8B0000 750}${color}
${voffset -8}
${font :size=10}Memory ${hr 1}
${voffset -10}
${font :size=9}RAM ${alignc}     $mem / $memmax ${alignr} ${color2}$memperc%${font}${color}
$membar
${voffset -8}
${font :size=10}GPU ${hr 1}
${voffset -10}
${font :size=9}iGPU: ${alignr}${execi 60 lspci | awk -F'[][]' '/VGA compatible controller|3D controller|Display controller/ {n++; if (n==1) print $2}' | head -n1}${font}
${font :size=9}iGPU Freq: ${alignr}${execi 1 sh -c 'for c in /sys/class/drm/card*; do [ -e "$c/gt_cur_freq_mhz" ] && cat "$c/gt_cur_freq_mhz" && break; done'}MHz${font}
${voffset -8}
${font :size=9}dGPU: ${alignr}${execi 60 lspci | awk -F'[][]' '/VGA compatible controller|3D controller|Display controller/ {n++; if (n==2) print $2}' | sed 's/ Max-Q.*//; s/ Mobile.*//; s/ Laptop GPU.*//' | head -n1}${font}
${font :size=9}dGPU Load: ${alignr}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null | head -n1}%${font}
${font :size=9}dGPU Temp: ${alignr}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits 2>/dev/null | head -n1}°C${font}
${font :size=9}dGPU VRAM: ${alignr}${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits 2>/dev/null | head -n1 | awk -F', ' '{print $1 "MiB"}'}${font}
${font :size=9}dGPU Power: ${alignr}${execi 2 nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits 2>/dev/null | head -n1}W${font}
${voffset -8}
${font :size=10}PROCESSES ${hr 1}${font}
${voffset -10} 
${font :size=9}Total: ${alignr}${color1}${processes}${font}${color}
${voffset -8}
${font :size=9}App Name ${alignr}Memory     CPU
${font :size=9}${top_mem name 1} ${alignr}${color2}${top mem 1} % ${top cpu 1} %${color}
${font :size=9}${top_mem name 2} ${alignr}${color2}${top mem 2} % ${top cpu 2} %${color}
${font :size=9}${top_mem name 3} ${alignr}${color2}${top mem 3} % ${top cpu 3} %${color}
${font :size=9}${top_mem name 4} ${alignr}${color2}${top mem 4} % ${top cpu 4} %${color}
${font :size=9}${top_mem name 5} ${alignr}${color2}${top mem 5} % ${top cpu 5} %${color}
]];
